[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhole"
version = "0.1.0"
description = "Lean-verified IDOR detector for web APIs (FastAPI + SQLAlchemy first)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
keyhole = "keyhole.cli:main"

[tool.setuptools.packages.find]
include = ["keyhole*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
